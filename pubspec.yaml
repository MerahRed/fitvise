name: FitVise
description: "A new Innovice project."
publish_to: 'none'
version: 0.1.0+4

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  supabase_flutter: ^2.9.1
  flutter_timer_countdown: ^1.0.7
  flutter_tts: ^4.2.3
  audioplayers: ^6.5.1
  pdf: ^3.11.0
  printing: ^5.13.0
  path_provider: ^2.1.2
  open_filex: ^4.4.0
  http: ^1.5.0



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: "^0.14.3"
  hive_generator: ^2.0.1
  build_runner: ^2.5.4


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/assets/Logo.JPG"

flutter:
  uses-material-design: true
  assets:
    - lib/assets/        # keep this for your GIFs
    - assets/sounds/     # add this for audio
    - assets/GIF FitVise/  # add this for GIFs



