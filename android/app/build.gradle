import java.util.Properties
import java.io.FileInputStream

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.fitvise.app"
    compileSdk 35
    ndkVersion flutter.ndkVersion

    defaultConfig {
        applicationId "com.fitvise.app"
        minSdk flutter.minSdkVersion
        targetSdk 35
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties["keyAlias"]
            keyPassword keystoreProperties["keyPassword"]
            storeFile keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
            storePassword keystoreProperties["storePassword"]
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            debuggable false
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }

    // Force compatible CameraX versions
    configurations.all {
        resolutionStrategy {
            force "androidx.camera:camera-core:1.4.0"
            force "androidx.camera:camera-camera2:1.4.0"
            force "androidx.camera:camera-lifecycle:1.4.0"
            force "androidx.camera:camera-video:1.4.0"
        }
    }
}

dependencies {
    // Enable desugaring
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"

    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.0" // Make sure this matches your kotlin version
    // Do NOT manually add com.google.mlkit dependencies; use Flutter plugin
}

flutter {
    source "../.."
}
